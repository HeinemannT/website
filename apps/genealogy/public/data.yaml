        text_zh: "觀位 字彥才子式洪 觀智 字彥松乃順賢公次子宗榮入嗣"
        translation: "**Guanwei**, courtesy name Yancai, had a son named Shihong. **Guanzhi**, courtesy name Yansong, was the second son of Lord Shunxian; Zongrong was adopted as his heir."
        translator_note: "Adoption: columns 4 and 9, together with page 30 column 8, identify Zongrong as Guanxin’s natural son and Guanzhi’s adopted heir. Shihong is Yuantai’s courtesy name (page 31), not a separate person. The sibling order around Guanzhi remains compressed."

