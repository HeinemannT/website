        translator_note: "Contextual reading: page 6 ends 至孫 and this page continues with Cong, followed by 曾孫紹科. Both “his grandson Cong” and “his great-grandson Shaoke” refer to Zhe, the subject of the biography; no intermediate parent link is established here.<br><br>External research: the [1927 Dongguan Gazetteer, actual juan 93](https://upload.wikimedia.org/wikipedia/commons/a/a3/NLC403-312001077662-61750_%E6%9D%B1%E8%8E%9E%E7%B8%A3%E8%AA%8C_%E6%B0%91%E5%9C%8B16%E5%B9%B4%281927%29_%E5%8D%B7%E4%B9%9D%E5%8D%81%E5%9B%9B.pdf) credits Panyu jinshi Lao Shaoke, a langzhong in the Nanjing Ministry of Works, with the calligraphy of Quejin Fang Ji (PDF page 19). PDF page 21 dates its erection to 1541, seventh lunar month. Wang Xiwen composed the prose. The hosting filename says juan 94, but the page headers identify juan 93. An [edited Kangxi Chengdu Gazetteer](https://upload.wikimedia.org/wikipedia/commons/9/92/SSID-12383837_%E6%88%90%E9%83%BD%E8%88%8A%E5%BF%97_%E9%80%9A%E5%BF%97%E9%A1%9E_9.pdf), juan 12, printed page 68 / PDF page 80, lists Panyu jinshi Lao Shaoke under qianshi. It gives neither an appointment year nor an education assignment. This is a likely external candidate, but differing ancestral names remain unresolved; no family lines are merged.<br><br>Regional context: the inscription commemorated Li Kai’s refusal of money from Siamese merchants; see [Guangzhou Museum researcher Li Liming’s discussion](https://gb.crntt.com/crn-webapp/cbspub/secDetail.jsp?bookid=10527&secid=10561). It does not establish that Shaoke traded with Siam or traveled there."

