      title: "17th & 18th Generation: Zongrong & Yongzhao"

    columns:
      - id: 1
        elevation: 0
        is_interlinear: false
        text_zh: "子四 長 [Gap] 次福玲 季福高 四良"
        translation: "He had four sons: the eldest [name unrecorded], the second Fuling, the third Fugao, and the fourth Liang."


      - id: 2
        elevation: -2
        is_interlinear: false
        text_zh: "元泰 字式洪 觀位公子 無嗣 宗榮子入嗣"
        translation: "**Yuantai**. Courtesy name: Shihong. He was the son of Lord Guanwei [16th Gen]. He had no heir, so Zongrong's son was adopted into his line."


      - id: 3 #Space


      - id: 4
        elevation: -3
        is_interlinear: false
        text_zh: "十八永兆 字其惠 號秀林 淡山公子 由行伍特授水師提標後營把總"
        translation: "**18th Generation: Yongzhao**. Courtesy name: Qihui. Art name: Xiulin. Son of Danshan [Shangda]. From service in the ranks, he was specially appointed bazong in the rear battalion under the naval commander."

        translator_note: "Manuscript statement: the recorded offices establish a naval career. Its overlap with the Opium War does not establish participation in that war; no campaign is named here."

      - id: 5
        elevation: 0
        is_interlinear: false
        text_zh: "陞授本營千總歷署水師提標後營中軍守備推陞湖南岳"
        translation: "He was subsequently promoted to qianzong of the same battalion. He successively served as Acting Garrison Commandant (Shoubei) of the Central Force in the Rear Battalion of the Naval Admiral's Command, and was later promoted"

        translator_note: "Editorial note: qianzong and shoubei are historical offices. Modern army equivalents and exact troop counts have been omitted because they vary by establishment and are not supplied here."

      - id: 6
        elevation: 0
        is_interlinear: false
        text_zh: "州水師營守備奉旨賞戴藍翎奏留廣東順德"
        translation: "to Garrison Commandant of the Yuezhou Naval Battalion in Hunan Province. He received an Imperial Decree awarding him the privilege of wearing the Blue Plume. He successfully memorialized the Emperor to be retained in the Guangdong Shunde Brigade,"
        translator_note: "Manuscript statement: the genealogy records the Yuezhou appointment, blue-plume award, and retention in Guangdong. Participation in Taiping or Red Turban campaigns requires separate military records; it cannot be inferred from dates and locations alone."

      - id: 7
        elevation: 0
        is_interlinear: false
        text_zh: "協左營儘先都司加三級緣因同治九年本鄉與新填村打"
        translation: "Left Battalion, as a Rank 4 'Priority' Commander (Dusi) with three additional merit grades. However, because in the 9th Year of the Tongzhi Reign (1870), our home village and Xintian Village engaged in"
        translator_note: "Manuscript statement: the entry records priority for a dusi appointment and three additional grades, then a village conflict in Tongzhi 9 (1870)."

        map_data: {"event_type":"conflict","location_name":"Xiaolao Village","location_status":"Legacy identification; geographic attribution unverified","page_ref":"img_31","column_ref":7,"original_calendar":"Chinese lunisolar","normalization_status":"year_identified","date_precision":"year","original_date":"同治九年 (Tongzhi 9 / 1870; year only)","source_text":"協左營儘先都司加三級緣因同治九年本鄉與新填村打","legacy_unverified_date":"1870-01-01","year":1870}

      - id: 8
        elevation: 0
        is_interlinear: false
        text_zh: "刼互訟控告不休已致族累罷職原品歸里公生于嘉慶十"
        translation: "armed fighting and filed lawsuits against each other endlessly, causing a burden to the clan, he was dismissed from his office. He returned to his home village while retaining his original rank. He was born in the 15th year of Jiaqing (1810)..."
        translator_note: "Manuscript statement: fighting and persistent lawsuits burdened the lineage; Yongzhao was dismissed and returned home retaining his rank. The precise dispute and the reason his rank was retained are not established."

