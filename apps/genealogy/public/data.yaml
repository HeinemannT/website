      - id: 5
        elevation: 0
        is_interlinear: false
        text_zh: "網百家曾之右邊崗坐壬向丙深二丈虛尺五寸濶二丈二"
        translation: "located on the right-side hill of the cemetery at Baijia-zeng, sitting in the Ren position and facing Bing. Depth 2 zhang 1 chi 5 cun. Width 2 zhang 2"


      - id: 6
        elevation: 0
        is_interlinear: false
        text_zh: "尺四寸其地與元巖公同買受"
        translation: ".chi 4 cun. This land was purchased jointly with Lord Yuanyan."


      - id: 7
        elevation: 0
        is_interlinear: false
        text_zh: "此山日久被土人盜莖及栽種樹木閉塞于咸豐七年十八"
        translation: "Over time, this mountain site was pillaged by locals who conducted illegal burials and planted trees, obstructing the path. In the 7th year of Xianfeng [1857]"
        translator_note: "Manuscript statement: local people made unauthorized burials and planted trees at the site. The record describes obstruction and later action over the grave; it does not establish a motive of stealing geomantic energy or destroying the lineage."

      - id: 8
        elevation: 0
        is_interlinear: false
        text_zh: "傳孫永兆在西省凱旋斬伐大松樹三十二株爭回原穴即"
        translation: "...the 18th-generation descendant Yongzhao, upon returning home in triumph from a military campaign in Guangxi (Western Province), cut down thirty-two large pine trees to reclaim the original grave site."
        map_data: {"event_type":"legal_dispute_resolution","location_name":"Panyu Ancestral Hill","location_status":"Legacy identification; geographic attribution unverified","page_ref":"img_13","column_ref":8,"original_calendar":"Chinese lunisolar","normalization_status":"unverified","date_precision":"source_expression","original_date":"Source excerpt: 傳孫永兆在西省凱旋斬伐大松樹三十二株爭回原穴即 (read with adjacent columns; Western conversion unverified)","source_text":"傳孫永兆在西省凱旋斬伐大松樹三十二株爭回原穴即","legacy_unverified_date":"1858-01-01"}

      - id: 9
        elevation: 0
        is_interlinear: false
        text_zh: "自捐捐工金及簽各房銀兩重修所有爭伏修山事情另立"
        translation: "He personally donated labor and funds, and organized the collection of silver from various family branches to rebuild it. All details regarding the dispute, settlement, and repair of the mountain site were recorded separately"


      - id: 10
        elevation: 0
        is_interlinear: false
        text_zh: "壹部存壙"
        translation: "in a dedicated volume preserved by the family."


