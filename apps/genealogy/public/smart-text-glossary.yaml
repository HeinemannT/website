terms:
  - term: "Jinshi"
    zh: "進士"
    definition: "The highest degree in the imperial examination system. It is not equivalent to a modern doctorate and did not guarantee national leadership."

  - term: "Zhuanshu"
    zh: "篆書"
    definition: "Seal Script. An ancient style of Chinese calligraphy, often used for official seals or formal inscriptions."

  - term: "Feng Shui"
    zh: "風水"
    definition: "Chinese geomancy. The practice of arranging buildings and graves to harmonize with the 'earth veins' (Qi) of the natural environment. Very prominent in this genealogy."

  - term: "Earth Veins"
    zh: "地脉"
    definition: "In feng shui belief, currents of qi associated with the landscape. The genealogy describes auspicious sites in these terms; prosperity is a belief, not an established effect."

  - term: "Couplet"
    zh: "對聯"
    definition: "A pair of lines of poetry that adhere to strict rules of meter, tone, and grammar. Often displayed on doorways or pillars."

  - term: "Yuan Dynasty"
    zh: "元朝"
    definition: "The Mongol-led imperial dynasty of China (1271–1368)."

  - term: "Ming Dynasty"
    zh: "明朝"
    definition: "The ruling dynasty of China from 1368 to 1644."

  - term: "Jiajing"
    zh: "嘉靖"
    definition: "Reign era: numbered lunar years correspond approximately to 1522–1566. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Hongwu"
    zh: "洪武"
    definition: "Reign era: numbered lunar years correspond approximately to 1368–1398. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Yongle"
    zh: "永樂"
    definition: "Reign era: numbered lunar years correspond approximately to 1403–1424. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Xuande"
    zh: "宣德"
    definition: "Reign era: numbered lunar years correspond approximately to 1426–1435. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Chenghua"
    zh: "成化"
    definition: "Reign era: numbered lunar years correspond approximately to 1465–1487. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Hongzhi"
    zh: "弘治"
    definition: "Reign era: numbered lunar years correspond approximately to 1488–1505. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Zhengde"
    zh: "正德"
    definition: "Reign era: numbered lunar years correspond approximately to 1506–1521. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Wanli"
    zh: "萬曆"
    definition: "Reign era: numbered lunar years correspond approximately to 1573–1620. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Guangxu"
    zh: "光緒"
    definition: "Reign era: numbered lunar years correspond approximately to 1875–1908. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Xiangsheng"
    zh: "庠生"
    definition: "A student of a county or prefectural government school in the imperial examination system."

  - term: "Zhaomu"
    zh: "昭穆"
    definition: "Generational ordering in ancestral rites and temples. This ritual arrangement is distinct from the generation-character alternatives recorded on page 3."

  - term: "Dingyou"
    zh: "丁酉"
    definition: "A designation in the sexagenary cycle (ganzhi), used for dating years."

  - term: "Taixia"
    zh: "胎夏"
    definition: "Courtesy name of the Founding Ancestor Yanzhong."

  - term: "Xiaolao"
    zh: "小勞"
    definition: "Literally Little Lao. According to this genealogy, the founder was called Xiaolao and associated that name with the place where he settled; the story is a manuscript claim."

  - term: "Zi"
    zh: "字"
    definition: "Courtesy name, distinct from the personal name. Its use does not establish another identity."

  - term: "Hao"
    zh: "號"
    definition: "Art name or sobriquet, written 號. The unit 毫 is a different character."

  - term: "Juren"
    zh: "舉人"
    definition: "Provincial Graduate. A candidate who passed the triennial provincial examination. Qualifies one for lower-level official posts, unlike the Xiangsheng (County Student)."

  - term: "Guozijian"
    zh: "國子監"
    definition: "The National Academy. The highest institution of learning in imperial China."

  - term: "Bone urn"
    zh: "金塔"
    definition: "Jinta. A burial urn used in secondary burials to store the bones of the deceased."

  - term: "Gaoyang"
    zh: "高陽"
    definition: "Name in the temple couplet. Its identification as a Lao ancestral choronym or proof of descent from Zhuanxu remains unverified."

  - term: "Tianshun"
    zh: "天順"
    definition: "Regnal era of the Ming Dynasty (1457–1464)."

  - term: "Longqing"
    zh: "隆慶"
    definition: "Regnal era of the Ming Dynasty (1567–1572)."

  - term: "Tianqi"
    zh: "天啟"
    definition: "Reign era: numbered lunar years correspond approximately to 1621–1627. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Chongzhen"
    zh: "崇禎"
    definition: "Reign era: numbered lunar years correspond approximately to 1628–1644. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Shunzhi"
    zh: "順治"
    definition: "Reign era: numbered lunar years correspond approximately to 1644–1661. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Kangxi"
    zh: "康熙"
    definition: "Reign era: numbered lunar years correspond approximately to 1662–1722. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Yongzheng"
    zh: "雍正"
    definition: "Reign era: numbered lunar years correspond approximately to 1723–1735. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Qianlong"
    zh: "乾隆"
    definition: "Reign era: numbered lunar years correspond approximately to 1736–1795. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Jiaqing"
    zh: "嘉慶"
    definition: "Reign era: numbered lunar years correspond approximately to 1796–1820. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Daoguang"
    zh: "道光"
    definition: "Reign era: numbered lunar years correspond approximately to 1821–1850. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Xianfeng"
    zh: "咸豐"
    definition: "Reign era: numbered lunar years correspond approximately to 1851–1861. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Tongzhi"
    zh: "同治"
    definition: "Reign era: numbered lunar years correspond approximately to 1862–1874. Era year one and accession year can differ; lunar years extend into the following Western year."

  - term: "Zhang"
    zh: "丈"
    definition: "A unit of length, approximately 3.3 meters in the modern standard. Historical measures varied; this is not a verified conversion of the genealogy’s grave dimensions."

  - term: "Chi"
    zh: "尺"
    definition: "A unit of length, approximately one-third of a meter in the modern standard. Historical measures varied; the original unit is retained in this edition."

  - term: "Cun"
    zh: "寸"
    definition: "One-tenth of a chi, approximately 3.3 centimeters in the modern standard. Historical measures varied; this is an orientation aid, not a precise historical conversion."

  - term: "Fen"
    zh: "分"
    definition: "Unit of measure. Can be 1/10th of a Cun (length) or 1/10th of a Mu (area)."

  - term: "Li"
    zh: "厘"
    definition: "Unit of measure. Can be 1/100th of a Cun (length) or 1/100th of a Mu (area)."

  - term: "Si"
    zh: "絲"
    definition: "A small fractional unit written 絲, distinct from 毫. Its base depends on the measurement context; an exact conversion requires the relevant local metrology."

  - term: "Gong"
    zh: "公"
    definition: "Respectful designation for a man or ancestor. Often translated Lord in this edition; the word alone does not establish noble rank."

  - term: "Lady"
    zh: "氏"
    definition: "The word Shi (氏) follows a family surname. Lady Zhou identifies a woman of the Zhou family; it does not supply her personal name."

  - term: "Concubine"
    zh: "妾"
    definition: "Qie (妾), a recognized historical relationship distinct from a principal spouse (配). The source’s wording should be preserved without assuming a motive."

  - term: "Bazong"
    zh: "把總"
    definition: "Historical military office, generally seventh rank in the Qing system. Exact strength and a modern unit equivalent are not established by this record."

  - term: "Qianzong"
    zh: "千總"
    definition: "Historical military office, generally sixth rank in the Qing system. No fixed troop count is implied here."

  - term: "Shoubei"
    zh: "守備"
    definition: "Historical military office commonly translated garrison commandant, generally fifth rank. Its specific duties depended on the appointment."

  - term: "Dusi"
    zh: "都司"
    definition: "Historical military office, generally fourth rank. Priority for appointment is a separate phrase, not the translation of the office itself."

  - term: "Zhaowu Duwei"
    zh: "昭武都尉"
    definition: "A fourth-rank military prestige title. An ancestral grant does not by itself establish active command or a blue-plume award."

  - term: "Blue Plume"
    zh: "藍翎"
    definition: "Lanling, a blue feather distinction worn with official headgear. The genealogy records Yongzhao’s award but does not name the campaign or deed behind it."

  - term: "Gongren"
    zh: "恭人"
    definition: "A rank-related honor associated with fourth rank, including honors conferred on women through descendants. It does not by itself establish that a husband held active fourth-rank office."

  - term: "Yiren"
    zh: "宜人"
    definition: "Lady of Suitability. Title for the wife of a Rank 5 official."

  - term: "Anren"
    zh: "安人"
    definition: "Lady of Peace. Title for the wife of a Rank 6 official."

  - term: "Ruren"
    zh: "孺人"
    definition: "Child Nurturer. Title for the wife of a Rank 7 official."

  - term: "Xiedou"
    zh: "械鬥"
    definition: "Armed fighting between local groups or lineages. Specific motives, weapons, and troop numbers cannot be inferred from this term alone."

  - term: "Ancestral Tablet"
    zh: "神主"
    definition: "A spirit tablet used in ancestral ritual. Within that ritual tradition it represents or houses the ancestor’s spirit; this describes a belief, not a physical claim."

  - term: "Longmai"
    zh: "龍脈"
    definition: "Dragon veins: landscape channels of qi in feng shui belief, used when interpreting auspicious burial sites. Their effects are not presented as established physical facts."

  - term: "Wooden Chicken"
    zh: "木鷄"
    definition: "Muji. A Daoist metaphor for perfect spiritual composure (from Zhuangzi)."

  - term: "Red Turban Rebellion"
    zh: "紅巾起義"
    definition: "A massive anti-Qing uprising in 1854 that devastated the Pearl River Delta."

  - term: "Taiping Rebellion"
    zh: "太平天國"
    definition: "Civil war in nineteenth-century China (1850–1864). The genealogy’s recorded dates and offices do not establish Yongzhao’s participation."
